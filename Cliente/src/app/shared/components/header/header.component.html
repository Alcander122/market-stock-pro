<header class="main-header">
    <div class="nav-layout">
        <div class="logo">
            <span class="logo-icon">🛒</span>
            <span class="logo-text">HORIZON <strong>MARKET</strong></span>
        </div>

        <div class="header-actions">
            <!-- SI EL USUARIO ESTÁ LOGUEADO -->
            <div class="user-logged" *ngIf="usuario">
                <span class="welcome-text">Hola, {{ usuario.nombreCompleto || usuario.nombre }}</span>
                <button class="action-btn" routerLink="/historial" title="Historial">📜</button>
                <button class="action-btn" (click)="logout()" title="Cerrar Sesión">🚪</button>
            </div>

            <!-- SI NO ESTÁ LOGUEADO -->
            <button class="action-btn" *ngIf="!usuario" routerLink="/login" title="Ingresar">👤</button>

            <button class="action-btn cart-btn" (click)="abrirCarrito.emit()">
                <div class="cart-wrapper">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-badge" *ngIf="cantidad > 0">{{ cantidad }}</span>
                </div>
            </button>
        </div>
    </div>
</header>
