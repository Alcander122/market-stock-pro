<div class="overlay" *ngIf="visible" (click)="cerrar.emit()"></div>

<div class="cart" [class.open]="visible">

    <!-- HEADER -->
    <div class="header">
        <h3>Mi Carrito</h3>
        <button (click)="cerrar.emit()">✖</button>
    </div>

    <!-- BODY -->
    <div class="body">

        <!-- VACÍO -->
        <div *ngIf="items.length === 0" class="empty-cart">
            <p>Tu carrito está vacío</p>
        </div>

        <!-- ITEMS -->
        <div class="item" *ngFor="let item of items; let i = index">

            <img [src]="item.imagenUrl || 'assets/no-image.png'">

            <div class="item-info">

                <p class="item-name">
                    {{ item.nombre }}
                </p>

                <!-- CONTROLES -->
                <div class="quantity-controls">
                    <button (click)="carritoService.disminuir(i)">−</button>
                    <span>{{ item.cantidad }}</span>
                    <button (click)="carritoService.agregar(item)">+</button>
                </div>

                <!-- PRECIO -->
                <p class="item-price">
                    ${{ item.precio * item.cantidad | number }}
                </p>

            </div>

            <!-- ELIMINAR -->
            <button class="remove-btn" (click)="eliminar(i)">
                🗑️
            </button>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer" *ngIf="items.length > 0">

        <div class="total-box">
            <span>Total:</span>
            <strong>${{ total | number }}</strong>
        </div>

        <!-- 🔥 CONFIRMAR -->
        <button class="checkout-btn" (click)="checkout()">
            Confirmar Compra
        </button>

    </div>

</div>
