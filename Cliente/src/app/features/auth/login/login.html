<div class="login-wrapper">
    <!-- Tarjeta central de inicio de sesión -->
    <div class="login-card">
        <h2 class="login-title">Iniciar Sesión</h2>

        <div class="form-group">
            <input [(ngModel)]="email" type="email" placeholder="Correo electrónico" class="hz-input"
                autocomplete="email">
        </div>

        <div class="form-group">
            <input [(ngModel)]="password" type="password" placeholder="Contraseña" class="hz-input"
                autocomplete="current-password">
        </div>

        <!-- Botón que utiliza las clases globales de styles.css -->
        <button class="hz-btn hz-btn-primary full-width" (click)="login()">
            Ingresar
        </button>

        <!-- Mensaje de error dinámico -->
        <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>
    </div>
</div>
