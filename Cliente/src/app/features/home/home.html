<div class="home-container">

    <!-- 🔥 ESCUDO SUPERIOR (SE MANTIENE) -->
    <div class="top-shield">

        <!-- 🔥 HEADER (MISMO ESTILO, SOLO COMPONENTIZADO) -->
        <app-header (abrirCarrito)="abrirCarrito()"></app-header>

        <!-- 🔍 BUSCADOR (IGUAL) -->
        <div class="search-mobile-row">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="¿Qué buscas?" (input)="buscarProducto($event)">
            </div>
        </div>

        <!-- 🎯 BANNER (IGUAL) -->
        <section class="hero-banner">
            <div class="placeholder-img">
                <h2>LAS MEJORES OFERTAS EN UN SOLO LUGAR</h2>
            </div>
        </section>

        <!-- 🧩 CATEGORÍAS (IGUAL) -->
        <nav class="categories-section">
            <button class="category-chip" (click)="filtrarPor(0)" [class.active]="categoriaSeleccionada === 0">
                ✨ Todos
            </button>

            <button class="category-chip" *ngFor="let cat of categorias" (click)="filtrarPor(cat.id)"
                [class.active]="categoriaSeleccionada === cat.id">

                {{ cat.icono }} {{ cat.nombre }}

            </button>
        </nav>

    </div>

    <!-- 🛍️ PRODUCTOS (IGUAL) -->
    <main class="products-grid">

        <div class="product-card" *ngFor="let prod of productosFiltrados">

            <div class="product-image-wrapper">
                <img [src]="prod.imagenUrl || 'assets/no-image.png'"
                    onerror="this.src='https://placehold.co/400x400?text=Producto'">
            </div>

            <div class="product-content">

                <div class="info-top">
                    <span class="category-pill">
                        {{ prod.categoria?.nombre || 'General' }}
                    </span>

                    <h3 class="product-title">
                        {{ prod.nombre }}
                    </h3>
                </div>

                <div class="product-footer">

                    <div class="price-container">
                        <span class="currency">$</span>
                        <span class="amount">{{ prod.precioReferencia | number }}</span>
                    </div>

                    <button class="add-to-cart-btn" (click)="agregarAlCarrito(prod)">
                        <span class="plus-icon">+</span>
                        <span class="btn-text">Añadir</span>
                    </button>

                </div>
            </div>

        </div>

    </main>

    <!-- 🛒 CARRITO GLOBAL -->
    <app-cart [visible]="carritoVisible" (cerrar)="cerrarCarrito()">
    </app-cart>

</div>
