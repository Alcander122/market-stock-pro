<app-admin-banner [vistaActual]="vistaActual" (cambiarVista)="cambiarVista($event)" (crearProducto)="abrirModalProducto()">
</app-admin-banner>

<app-productos-admin #productosAdmin *ngIf="vistaActual === 'productos'" [productos]="productosFiltrados"
    (filtrar)="filtrarPor($event)" (recargar)="cargarProductos()">
</app-productos-admin>

<app-pedidos-admin *ngIf="vistaActual === 'pedidos'" [pedidos]="listaPedidos" [estados]="estadosPedido"
    (cambiarEstado)="cambiarEstadoPedido($event.id, $event.estado)">
</app-pedidos-admin>

<app-usuarios-admin *ngIf="vistaActual === 'usuarios'"></app-usuarios-admin>
